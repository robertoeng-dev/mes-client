# config.example.yaml — Modelo de configuração do MES Client 2.0
#
# Copie para config.yaml (o instalador gera sozinho). config.yaml NÃO vai
# para o git: tem dados de cada PC.
#
# Cliente 2.0 = cadastro centralizado. Estação, linha, seção, formato do log
# e padrão de arquivo vêm do servidor (MES Cadastro). Aqui fica só:
# a conexão do domínio e quais fontes ESTE PC lê, e de qual pasta.
# Os vínculos são criados pela tela FONTES DESTE PC (não precisa editar à mão).

database:
  enabled: true
  host: 172.21.70.184          # servidor PostgreSQL
  port: 5432
  name: mes_nonalpha           # banco do domínio: mes_nonalpha | mes_alpha
  user: mes_client_nonalpha    # role das estações do domínio
  password: ${MES_DB_PASSWORD} # no arquivo .env (NUNCA aqui)
  # O cliente NÃO cria banco nem tabela; confere mes_schema_version = 2.

cliente:
  host_id: ""                  # vazio = nome do PC (COMPUTERNAME). É o nome
                               # que o banco compara com o vínculo da estação.

vinculos:                      # fontes de log lidas por este PC
  - estacao: CAIAPO-M13-FT     # código cadastrado no MES Cadastro
    fonte: FT                  # fonte dentro da estação (FT, OCV, AOI...)
    pasta: D:\battData         # pasta local onde o equipamento grava
    sync_destino: ""           # opcional: cópia dos arquivos para a rede

operation:
  mode: database               # "database" | "both" (banco + cópia) | "sync" (só cópia)

sync:
  destination_folder: ""       # usado só se houver UM vínculo sem sync_destino
  mode: diff                   # "diff" | "copy_overwrite" | "sync"

parser:
  scan_interval: 5             # segundos entre leituras

spec_check:
  enabled: false
  file: spec_limits.csv

auth:
  operador_password: ""        # vazio = OPERADOR sem senha (arranque automático)
  engenharia_password: "admin" # ações restritas: CONFIG, FONTES, parar, sair
